<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Settings · SSUD UI</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="pages.css">
  <script defer src="settings.js"></script>
</head>
<body class="ssud-ui">
  <div class="page adaptive-page">
    <header>
      <nav class="kit-nav" aria-label="UI kit examples">
        <a href="index.html">Components</a><a href="../example/index.html">Files</a><a href="settings.html" aria-current="page">Settings</a><a href="transfers.html">Transfers</a>
      </nav>
      <h1>Workspace settings</h1>
    </header>
    <main>
      <form class="panel adaptive-columns form-panel" id="settings" novalidate>
        <section class="notice-box error-text adaptive-wide" id="error-summary" aria-labelledby="summary-title" tabindex="-1" hidden>
          <h2 id="summary-title">Check your settings</h2>
          <ul id="error-links"></ul>
        </section>
        <div class="field">
          <label for="workspace-name">Workspace name</label>
          <input id="workspace-name" name="workspace" required maxlength="80" placeholder="e.g. 문서 보관함">
          <p class="field-error error-text" id="workspace-error"></p>
        </div>
        <div class="field">
          <label for="language">Language</label>
          <select id="language" name="language"><option>English</option><option lang="ko">한국어</option></select>
        </div>
        <div class="field">
          <label for="page-size">Rows per page</label>
          <input type="number" id="page-size" name="pageSize" min="5" max="100" value="3" required aria-describedby="page-size-hint">
          <small class="muted" id="page-size-hint">Enter a number from 5 to 100.</small>
          <p class="field-error error-text" id="page-size-error"></p>
        </div>
        <fieldset class="stack adaptive-wide">
          <legend>Default view</legend>
          <label class="touch-choice"><input type="radio" name="view" value="list" checked> List</label>
          <label class="touch-choice"><input type="radio" name="view" value="details"> Details</label>
        </fieldset>
        <label class="adaptive-wide touch-choice"><input type="checkbox" name="notifications" checked> Show transfer notifications</label>
        <div class="field adaptive-wide">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" rows="3"></textarea>
        </div>
        <div class="actions adaptive-wide"><button class="primary">Save settings</button></div>
        <p class="success-text adaptive-wide" id="saved" role="status"></p>
      </form>
    </main>
  </div>
</body>
</html>
